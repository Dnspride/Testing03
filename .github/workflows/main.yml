
name: Python CI-CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Python Build and Execution
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Update Ubuntu
        run: |
          sudo apt-get update

      - name: 3. Install Python
        run: |
          sudo apt-get install -y python3 python3-pip

      - name: 4. Verify Installation
        run: |
          python3 --version
          pip3 --version

      - name: 5. Run Python Application
        run: |
          python3 app.py

      - name: 6. Build Confirmation
        run: |
          echo "================================"
          echo "CI/CD PIPELINE COMPLETED"
          echo "Python Application Successful"
          echo "================================"
